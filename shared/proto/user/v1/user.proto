syntax = "proto3";

package user.v1;

option go_package = "github.com/TikhonovNikita1996/Go-microservises-project/shared/pkg/proto/user/v1;user_v1";

import "common/v1/user.proto";

//User service для регистрации и получения пользователя
service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse); // Регистрация пользователя
  rpc GetUser(GetUserRequest) returns (GetUserResponse); // Поулчение информации о пользователе
}

// Информация для регистрации пользователя
message UserRegistrationInfo {
  common.v1.UserInfo info = 1;    // Основная информация пользователя
  string password = 2;            // Пароль
}

// Запрос для регистрации
message RegisterRequest {
  UserRegistrationInfo info = 1;  // Данные для регистрации
}

// Ответ после регистрации
message RegisterResponse {
  string user_uuid = 1;           // UUID созданного пользователя
}

// Запрос на информацию о пользователе
message GetUserRequest {
  string user_uuid = 1;           // UUID пользователя
}

// Ответ на запрос информации о пользователе
message GetUserResponse {
  common.v1.User user = 1;        // Пользователь
}